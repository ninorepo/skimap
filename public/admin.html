<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Page</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f8fafc;
      color: #1e293b;
    }

    #editor-dialog {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, .45);
      backdrop-filter: blur(4px);
      overflow-y: auto;
      padding: 24px 16px;
    }

    #editor-dialog.hide {
      display: none;
    }

    #editor-dialog .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .15);
    }

    #editor-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #editor-form > label {
      font-size: .875rem;
      font-weight: 600;
      margin-top: 8px;
    }

    #editor-form input[type="text"],
    #editor-form select,
    #editor-form textarea {
      width: 100%;
    }

    #editor-form textarea {
      min-height: 180px;
    }

    #editor-form .era-options {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      margin: 4px 0;
    }

    #editor-form .era-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      font-weight: 400;
    }

    #editor-form .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    dialog.modal {
      border: none;
      padding: 0;
      background: transparent;
      color: inherit;
      max-width: none;
      max-height: none;
      overflow: visible;
    }

    dialog.modal::backdrop {
      background: rgba(15, 23, 42, .45);
      backdrop-filter: blur(4px);
    }

    dialog .modal-box {
      width: calc(100% - 32px);
      max-width: 440px;
    }

    .city-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 24px;
    }
#content-list .container .row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  border-bottom: 1px solid #e2e8f0;
  background: white;
  transition: background .15s ease;
}

#content-list .container .row:hover {
  background: #f8fafc;
}

#content-list .container .row span {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

#content-list .container .row:first-child {
  font-weight: 600;
  background: #f1f5f9;
  color: #475569;
}

#content-list .container .row:last-child {
  border-bottom: none;
}

  </style>

</head>

<body>
  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">

    <header class="mb-8">
      <p id="welcome-message" class="mb-2 text-sm font-semibold uppercase tracking-widest text-primary">
        Administration
      </p>
      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">
        History Manager
      </h1>
      <p class="mt-2 text-base text-base-content/60">
        Manage historical events and their locations.
      </p>
    </header>

    <section id="control"
      class="mb-6 flex flex-wrap items-center gap-3 rounded-2xl border border-base-300/60 bg-base-100 p-4 shadow-sm">
      <button id="add-history"
        data-edit-mode="insert"
        class="btn btn-primary">
        <span class="text-lg">+</span>
        Add History
      </button>

      <button id="add-city-button"
        class="btn btn-outline">
        <span class="text-lg">+</span>
        Add City
      </button>
    </section>

    <section id="content-list"
      class="mb-6 rounded-2xl border border-base-300/60 bg-base-100 p-4 shadow-sm sm:p-6">
      <div class="container space-y-4">
      </div>
    </section>

    <section id="pagination"
      class="flex justify-center">
      <div class="container flex flex-wrap justify-center gap-2">
      </div>
    </section>

    <!-- History editor -->
    <section id="editor-dialog" class="hide">
      <div class="container">
        <div class="mb-6">
          <h2 class="text-2xl font-bold">Edit History</h2>
          <p class="mt-1 text-sm text-base-content/60">
            Enter the event details below.
          </p>
        </div>

        <form id="editor-form">
          <input type="hidden" name="update" value="">
          <input type="hidden" name="id" value="">

          <label for="title">Title</label>
          <input id="title" type="text" name="title"
            class="input input-bordered"
            placeholder="Event title">

          <label for="year">Year</label>
          <input id="year" type="text" name="year"
            class="input input-bordered"
            placeholder="Contoh: 1945">

          <div class="era-options">
            <label for="masehi">
              <input id="masehi" type="radio" name="era"
                value="masehi" checked class="radio radio-primary radio-sm">
              Masehi
            </label>

            <label for="sebelum-masehi">
              <input id="sebelum-masehi" type="radio" name="era"
                value="sebelum masehi" class="radio radio-primary radio-sm">
              Sebelum Masehi
            </label>
          </div>

          <label for="city">Location</label>
          <select id="city" name="city" class="select select-bordered">
            <option value="empty">Empty</option>
          </select>

          <label for="editor">Content</label>
          <textarea id="editor" name="content"
            class="textarea textarea-bordered"
            placeholder="Write the historical event..."></textarea>

          <div class="form-actions">
            <button id="cancel-editor" type="button"
              class="btn btn-ghost">Cancel</button>
            <button id="submit" type="submit"
              class="btn btn-primary">Submit</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="py-6 text-center text-sm text-base-content/40">
    History Manager
  </footer>

  <!-- Add city dialog -->
  <dialog id="add-city" class="modal">
    <div class="modal-box rounded-2xl p-6 sm:p-8">
      <h3 class="mb-2 text-xl font-bold">Add City</h3>
      <p class="mb-6 text-sm text-base-content/60">
        Enter the city name and its coordinates.
      </p>

      <div class="city-fields">
        <input id="city-name" type="text"
          class="input input-bordered w-full"
          placeholder="City" required>

        <input id="city-latitude" type="number" step="any"
          class="input input-bordered w-full"
          placeholder="Latitude" required>

        <input id="city-longitude" type="number" step="any"
          class="input input-bordered w-full"
          placeholder="Longitude" required>
      </div>

      <div class="modal-actions">
        <button id="cancel-add-city" type="button"
          class="btn btn-ghost">Cancel</button>
        <button id="submit-add-city" type="button"
          class="btn btn-primary">Submit</button>
      </div>
    </div>
  </dialog>

  <!-- Confirmation dialog -->
  <dialog id="confirm-modal" class="modal">
    <div class="modal-box rounded-2xl p-6 sm:p-8">
      <div id="confirm-message">
        <h4 class="text-xl font-bold">Question</h4>
        <p class="mt-2 text-sm text-base-content/60">Description</p>
      </div>

      <div class="modal-actions">
        <button id="confirm-no" class="btn btn-ghost">No</button>
        <button id="confirm-yes" class="btn btn-primary">Yes</button>
      </div>
    </div>
  </dialog>
  <script>
verify();
async function verify(){
	const response = await fetch("/api/user/verify");
	if(!response)
		window.location.replace("/login");
	const json = await response.json();
	if(!json.success)
		window.location.replace("/login");
	const welcome_message = document.getElementById("welcome-message");
	const user = json.user;
	welcome_message.textContent = `Hi ${user.username}, welcome to`;
}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hugerte@1/hugerte.min.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
