<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Page</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f8fafc;
      color: #1e293b;
    }

    #editor-dialog {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, .45);
      backdrop-filter: blur(4px);
      overflow-y: auto;
      padding: 24px 16px;
    }

    #editor-dialog.hide {
      display: none;
    }

    #editor-dialog .container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .15);
    }

    #editor-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #editor-form > label {
      font-size: .875rem;
      font-weight: 600;
      margin-top: 8px;
    }

    #editor-form input[type="text"],
    #editor-form select,
    #editor-form textarea {
      width: 100%;
    }

    #editor-form textarea {
      min-height: 180px;
    }

    #editor-form .era-options {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      margin: 4px 0;
    }

    #editor-form .era-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      font-weight: 400;
    }

    #editor-form .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    dialog.modal {
      border: none;
      padding: 0;
      background: transparent;
      color: inherit;
      max-width: none;
      max-height: none;
      overflow: visible;
    }

    dialog.modal::backdrop {
      background: rgba(15, 23, 42, .45);
      backdrop-filter: blur(4px);
    }

    dialog .modal-box {
      width: calc(100% - 32px);
      max-width: 440px;
    }

    .city-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 24px;
    }
#content-list .container .row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  border-bottom: 1px solid #e2e8f0;
  background: white;
  transition: background .15s ease;
}

#content-list .container .row:hover {
  background: #f8fafc;
}

#content-list .container .row span {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

#content-list .container .row:first-child {
  font-weight: 600;
  background: #f1f5f9;
  color: #475569;
}

#content-list .container .row:last-child {
  border-bottom: none;
}

  width: 100vw;
  max-width: none;
  height: 100dvh;

  margin: 0;
  border-radius: 0;

<body>
  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">

    <header class="mb-8">
      <p id="welcome-message" class="mb-2 text-sm font-semibold uppercase tracking-widest text-primary">
        Administration
      </p>
      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">
        History Manager
      </h1>
      <p class="mt-2 text-base text-base-content/60">
        Manage historical events and their locations.
      </p>
    </header>

    <section id="control"
      class="mb-6 flex flex-wrap items-center gap-3 rounded-2xl border border-base-300/60 bg-base-100 p-4 shadow-sm">
      <button id="add-history"
        data-edit-mode="insert"
        class="btn btn-primary">
        <span class="text-lg">+</span>
        Add History
      </button>

      <button id="add-city-button"
        class="btn btn-outline">
        <span class="text-lg">+</span>
        Add City
      </button>

      <button id="ai-assistant-button"
        class="btn btn-outline">
        <span class="text-lg">☁</span>
        AI Assistant
      </button>
    </section>

    <section id="content-list"
      class="mb-6 rounded-2xl border border-base-300/60 bg-base-100 p-4 shadow-sm sm:p-6">
      <div class="container space-y-4">
      </div>
    </section>

    <section id="pagination"
      class="flex justify-center">
      <div class="container flex flex-wrap justify-center gap-2">
      </div>
    </section>

    <!-- History editor -->
    <section id="editor-dialog" class="hide">
      <div class="container">
        <div class="mb-6">
          <h2 class="text-2xl font-bold">Edit History</h2>
          <p class="mt-1 text-sm text-base-content/60">
            Enter the event details below.
          </p>
        </div>

        <form id="editor-form">
          <input type="hidden" name="update" value="">
          <input type="hidden" name="id" value="">

          <label for="title">Title</label>
          <input id="title" type="text" name="title"
            class="input input-bordered"
            placeholder="Event title">

          <label for="year">Year</label>
          <input id="year" type="text" name="year"
            class="input input-bordered"
            placeholder="Contoh: 1945">

          <div class="era-options">
            <label for="masehi">
              <input id="masehi" type="radio" name="era"
                value="masehi" checked class="radio radio-primary radio-sm">
              Masehi
            </label>

            <label for="sebelum-masehi">
              <input id="sebelum-masehi" type="radio" name="era"
                value="sebelum masehi" class="radio radio-primary radio-sm">
              Sebelum Masehi
            </label>
          </div>

          <label for="city">Location</label>
          <select id="city" name="city" class="select select-bordered">
            <option value="empty">Empty</option>
          </select>

          <label for="editor">Content</label>
          <textarea id="editor" name="content"
            class="textarea textarea-bordered"
            placeholder="Write the historical event..."></textarea>

          <div class="form-actions">
            <button id="cancel-editor" type="button"
              class="btn btn-ghost">Cancel</button>
            <button id="submit" type="submit"
              class="btn btn-primary">Submit</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="py-6 text-center text-sm text-base-content/40">
    History Manager
  </footer>

  <!-- Add city dialog -->
  <dialog id="add-city" class="modal">
    <div class="modal-box rounded-2xl p-6 sm:p-8">
      <h3 class="mb-2 text-xl font-bold">Add City</h3>
      <p class="mb-6 text-sm text-base-content/60">
        Enter the city name and its coordinates.
      </p>

      <div class="city-fields">
        <input id="city-name" type="text"
          class="input input-bordered w-full"
          placeholder="City" required>

        <input id="city-latitude" type="number" step="any"
          class="input input-bordered w-full"
          placeholder="Latitude" required>

        <input id="city-longitude" type="number" step="any"
          class="input input-bordered w-full"
          placeholder="Longitude" required>
      </div>

      <div class="modal-actions">
        <button id="cancel-add-city" type="button"
          class="btn btn-ghost">Cancel</button>
        <button id="submit-add-city" type="button"
          class="btn btn-primary">Submit</button>
      </div>
    </div>
  </dialog>

  <!-- Confirmation dialog -->
  <dialog id="confirm-modal" class="modal">
    <div class="modal-box rounded-2xl p-6 sm:p-8">
      <div id="confirm-message">
        <h4 class="text-xl font-bold">Question</h4>
        <p class="mt-2 text-sm text-base-content/60">Description</p>
      </div>

      <div class="modal-actions">
        <button id="confirm-no" class="btn btn-ghost">No</button>
        <button id="confirm-yes" class="btn btn-primary">Yes</button>
      </div>
    </div>
  </dialog>

<dialog id="ai-assistant" class="modal p-0">
  <div class="modal-box w-screen h-screen max-w-none max-h-none rounded-none p-4 flex flex-col gap-4">

    <div class="flex items-center justify-between shrink-0">
      <h3 class="text-lg font-bold">AI Assistant</h3>
      <button class="btn btn-sm btn-ghost">✕</button>
    </div>

    <div
      id="ai-assitant-display"
      class="flex-1 min-h-0 overflow-auto rounded-lg border border-base-300 p-3"
    ></div>

    <textarea
      id="ai-assistant-input"
      class="textarea textarea-bordered w-full shrink-0"
      placeholder="Ask something..."
      rows="3"
    ></textarea>

    <div class="flex justify-end gap-2 shrink-0">
      <button id="ai-assistant-upload" class="btn btn-outline">
        Upload
      </button>

      <button id="ai-assistant-ask" class="btn btn-primary">
        ☁
      </button>
    </div>

  </div>
</dialog>
<script>
verify();
async function verify(){
	const response = await fetch("/api/user/verify");
	if(!response)
		window.location.replace("/login");
	const json = await response.json();
	if(!json.success)
		window.location.replace("/login");
	const welcome_message = document.getElementById("welcome-message");
	const user = json.user;
	welcome_message.textContent = `Hi ${user.username}, welcome to`;
}
async function aiAssistantDialog() {
  return new Promise((resolve) => {
    const dialog = document.getElementById("ai-assistant");
    const displayArea = document.getElementById("ai-assitant-display");
    const promptInput = dialog.querySelector('input[type="textarea"]') || dialog.querySelector('input, textarea');
    
    // Selecting buttons (handling ID differences gracefully)
    const askButton = document.getElementById("ai-assistant-ask");
    const uploadButton = document.getElementById("ai-assistant-upload");
    
    // Find close button (the first button in dialog or by ID if added)
    let closeButton = document.getElementById("ai-assistant-close");
    if (!closeButton) {
      closeButton = dialog.querySelector("button"); // Fallback to the 'x' button
    }

    // Variable to keep the original response data intact
    let historicalData = [];

    // Open the modal dialog
    dialog.showModal();

    // -------------------------------------------------------------
    // 1. ASK BUTTON HANDLER
    // -------------------------------------------------------------
    askButton.onclick = async () => {
      const promptText = promptInput.value.trim();
      if (!promptText) {
        alert("Harap masukkan prompt terlebih dahulu.");
        return;
      }

      askButton.disabled = true;
      askButton.textContent = "⏳ Processing...";
      displayArea.innerHTML = "<p>Sedang mengambil data dari AI...</p>";

      try {
        // Send request to your Cloudflare Worker backend endpoint
        const response = await fetch("/api/assistant/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ prompt: promptText }),
        });
	
	console.log("Response: ", response);
        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        // Store original array response: [{ year, city, title, content, longitude, latitude }, ...]
        historicalData = await response.json();

        // Render data into display DOM in a clean table format
        renderTable(historicalData, displayArea);

      } catch (err) {
        console.error("Failed to query AI Assistant:", err);
        displayArea.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
      } finally {
        askButton.disabled = false;
        askButton.textContent = "☁";
      }
    };

    // -------------------------------------------------------------
    // 2. UPLOAD BUTTON HANDLER
    // -------------------------------------------------------------
    uploadButton.onclick = async () => {
      if (!historicalData || historicalData.length === 0) {
        alert("Tidak ada data untuk diunggah. Silakan tanyakan data sejarah terlebih dahulu.");
        return;
      }

      uploadButton.disabled = true;
      uploadButton.textContent = "Uploading...";

      try {
        // Step A: Extract location data -> array of { city, longitude, latitude }
        const locationList = historicalData.map((item) => ({
          city: item.city,
          longitude: item.longitude,
          latitude: item.latitude,
        }));

        // Step B: Send location data element by element sequentially
        console.log("Starting location uploads...");
        for (let i = 0; i < locationList.length; i++) {
          const loc = locationList[i];
          await fetch("/api/editor/add-city", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(loc),
          });
          console.log(`Uploaded location (${i + 1}/${locationList.length}): ${loc.city}`);
        }

        // Step C: Extract non-location event data -> { year, title, content, city }
        // (including city as a reference key if needed by your backend)
        const eventList = historicalData.map((item) => ({
	  update: "false",
	  id: null,
          year: item.year,
          title: item.title,
          content: item.content,
          city: item.city
        }));

        // Step D: Send event data element by element sequentially to a different endpoint
        console.log("Starting event uploads...");
        for (let i = 0; i < eventList.length; i++) {
          const eventItem = eventList[i];
          await fetch("/api/editor/edit-history", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(eventItem),
          });
          console.log(`Uploaded event (${i + 1}/${eventList.length}): ${eventItem.title}`);
        }

        alert("Semua data lokasi dan peristiwa berhasil diunggah!");

      } catch (err) {
        console.error("Upload error:", err);
        alert(`Gagal mengunggah data: ${err.message}`);
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "upload";
      }
    };

    // -------------------------------------------------------------
    // 3. CLOSE BUTTON HANDLER
    // -------------------------------------------------------------
    closeButton.onclick = () => {
      dialog.close();
      resolve(true);
    };
  });
}

// -----------------------------------------------------------------
// Helper Function: Formats year integer according to your specification
// (>0 = Masehi, <=0 = Sebelum Masehi, 0 = 1 SM)
// -----------------------------------------------------------------
function formatYear(yearInt) {
  if (yearInt > 0) {
    return `${yearInt} Masehi`;
  } else if (yearInt === 0) {
    return `1 Sebelum Masehi`;
  } else {
    return `${Math.abs(yearInt)} Sebelum Masehi`;
  }
}

// -----------------------------------------------------------------
// Helper Function: Renders data array into HTML table
// -----------------------------------------------------------------
function renderTable(data, container) {
  if (!Array.isArray(data) || data.length === 0) {
    container.innerHTML = '<p class="text-base-content/60">Data tidak ditemukan.</p>';
    return;
  }

  let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';

  data.forEach((item) => {
    html += `
      <div class="card bg-base-200 shadow-sm">
        <div class="card-body gap-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="badge badge-primary">${formatYear(item.year)}</span>
            <span class="text-sm text-base-content/60">
              ${escapeHtml(item.city)}
            </span>
          </div>

          <h3 class="card-title text-base">
            ${escapeHtml(item.title)}
          </h3>

          <p class="text-sm whitespace-pre-wrap break-words">
            ${escapeHtml(item.content)}
          </p>

          <div class="text-xs text-base-content/60 border-t border-base-300 pt-3">
            Koordinat: ${item.latitude}, ${item.longitude}
          </div>
        </div>
      </div>
    `;
  });

  html += '</div>';

  container.innerHTML = html;
}

// Helper to escape HTML string safely
function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

  </script>
