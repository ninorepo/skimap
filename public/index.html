<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKI Map</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #f8fafc;
      color: #1e293b;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: min(320px, calc(100% - 40px));
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 18px;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(15, 23, 42, .10);
    }

    #hud h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    #hud h2 {
      margin-top: 5px;
      margin-bottom: 18px;
      font-size: .875rem;
      font-weight: 400;
      color: #64748b;
    }

    #choose-year {
      width: 100%;
    }

    dialog {
      position: fixed;
      inset: 0;
      margin: auto;
      width: calc(100% - 32px);
      max-width: 480px;
      max-height: 85vh;
      padding: 24px;
      overflow: auto;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      background: white;
      color: #1e293b;
      box-shadow: 0 24px 64px rgba(15, 23, 42, .2);
    }

    dialog::backdrop {
      background: rgba(15, 23, 42, .45);
      backdrop-filter: blur(4px);
    }

    #dialog-years-cancel,
    #dialog-content-close {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: #f1f5f9;
      color: #475569;
      font-size: 1.2rem;
      cursor: pointer;
    }

    #dialog-years-cancel:hover,
    #dialog-content-close:hover {
      background: #e2e8f0;
    }

    #dialog-years-cancel {
      margin-left: auto;
    }

    #dialog-years {
      max-width: 380px;
    }

    #dialog-years h3 {
      margin-bottom: 18px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    #dialog-content {
      z-index: 20;
    }

    #dialog-content .navigation {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    #dialog-years button {
  padding: 10px 16px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  background: #f8fafc;
  color: #334155;
  font-weight: 600;
  cursor: pointer;
  transition: .15s ease;
}

#dialog-years button:hover {
  background: #eef2ff;
  border-color: #818cf8;
  color: #4f46e5;
}

#dialog-years button:active {
  background: #4f46e5;
  color: white;
}

    #content {
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    #content h1,
    #content h2,
    #content h3 {
      margin: 16px 0 8px;
      line-height: 1.3;
    }

    #content p {
      margin-bottom: 12px;
    }

    @media (max-width: 480px) {
      #hud {
        top: 12px;
        left: 12px;
        width: calc(100% - 24px);
        padding: 18px;
      }

      #hud h1 {
        font-size: 1.3rem;
      }

      dialog {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <header></header>

  <main>
    <div id="map"></div>

    <section id="hud">
      <h1>SKI Map</h1>
      <h2></h2>

      <button id="choose-year" class="btn btn-primary">
        Pilih Tahun
      </button>
    </section>
  </main>

  <footer></footer>

  <dialog id="dialog-years">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-xl font-bold">Pilih Tahun</h3>
      <button id="dialog-years-cancel" type="button"
        aria-label="Close">×</button>
    </div>

    <!-- Your year-selection elements can be inserted here. -->
  </dialog>

  <dialog id="dialog-content">
    <div class="navigation">
      <button id="dialog-content-close" type="button"
        aria-label="Close">×</button>
    </div>

    <div id="content"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="/index.js"></script>
</body>
</html>
