<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKI Map</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #f8fafc;
      color: #1e293b;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #prompt {
      position: fixed;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      z-index: 50;
      display: flex;
      align-items: flex-end;
      gap: .5rem;
      padding: .5rem;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 1rem;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(15,23,42,.12);
    }

    #prompt-input {
      flex: 1;
      min-width: 0;
      height: 2.5rem;
      min-height: 2.5rem;
      resize: vertical;
      background: white;
      border-color: #e2e8f0;
    }

    #ask {
      flex-shrink: 0;
    }

    #menu {
      position: fixed;
      z-index: 40;
      top: 5.5rem;
      right: 1rem;
      display: flex;
      gap: .5rem;
      padding: .5rem;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 1rem;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(15,23,42,.1);
    }

    dialog {
      width: calc(100% - 2rem);
      max-width: 40rem;
      max-height: 85vh;
      margin: auto;
      padding: 0;
      overflow: auto;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      background: white;
      color: #1e293b;
      box-shadow: 0 24px 64px rgba(15,23,42,.2);
    }

    dialog::backdrop {
      background: rgba(15,23,42,.5);
    }

    dialog .container {
      padding: 1.5rem;
    }

    #read-more h1 {
      margin-bottom: 1rem;
      font-size: 1.5rem;
      font-weight: 800;
    }

    #read-more .content {
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    #read-more .content h1,
    #read-more .content h2,
    #read-more .content h3 {
      margin: 1rem 0 .5rem;
      line-height: 1.3;
    }

    #read-more .content p {
      margin-bottom: .75rem;
    }

    #read-more .container > button {
      display: block;
      margin-top: 1.5rem;
      margin-left: auto;
    }

    #yes-no .actions {
      display: flex;
      justify-content: flex-end;
      gap: .5rem;
      margin-top: 1.5rem;
    }

    .marker {
      background: transparent !important;
      color: white;
      font-size: .6rem;
      margin: 0;
      padding: 0;
    }

    .marker > div {
      display: block;
      padding: .4rem;
      background: rgba(0,0,0,.7);
      border-radius: .4rem;
      transform: translateY(-50%);
    }

    .marker > div:hover {
	background: darkcyan;
    }

    .marker-pin {
      background: transparent !important;
      padding: 0;
      margin: 0;
    }

    .marker-pin p {
      text-align: center;
      font-size: 1rem;
    }

    .marker-events,
    .marker-events * {
      pointer-events: auto;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      #prompt {
        top: .75rem;
        left: .75rem;
        right: .75rem;
      }

      #ask {
        padding-inline: .8rem;
      }

      #menu {
        top: 5rem;
        right: .75rem;
      }

      dialog .container {
        padding: 1.25rem;
      }
    }
  </style>
</head>

<body>
  <header></header>

  <main>
    <div id="map"></div>

    <section id="prompt">
      <textarea
        id="prompt-input"
        class="textarea textarea-bordered"
        rows="1"
        placeholder="Petakan sejarah..."
      ></textarea>

      <button id="ask" class="btn btn-primary" title="Ask AI">
        Jalankan
      </button>
    </section>

    <section id="menu" style="display:none;">
      <button id="save" class="btn btn-primary btn-sm">
        Simpan
      </button>
      <button id="load" class="btn btn-outline btn-sm">
        Buka
      </button>
    </section>
  </main>

  <footer></footer>

  <dialog id="read-more">
    <div class="container">
      <h1></h1>
      <div class="content"></div>
      <button class="btn btn-primary">Tutup</button>
    </div>
  </dialog>

  <!-- Storage list dialog -->
  <dialog id="storage-dialog">
    <div class="container">
      <div class="flex items-center justify-between gap-4 mb-4">
        <h2 class="text-xl font-bold">Data Tersimpan</h2>
        <button class="btn btn-ghost btn-sm" data-close-dialog="storage-dialog">✕</button>
      </div>

      <!-- Render saved files here -->
      <div id="storage-list" class="flex flex-col gap-3"></div>
    </div>
  </dialog>

  <dialog id="view">
    <div class="container">
      <div class="flex items-center justify-between gap-4 mb-4">
        <h2 class="text-xl font-bold">Detail Data</h2>
        <button class="btn btn-ghost btn-sm" data-close-dialog="view">✕</button>
      </div>
    </div>
  </dialog>

  <dialog id="confirm-dialog">
    <div id="yes-no" class="container">
      <h4 class="text-lg font-bold"></h4>
      <div class="actions">
        <button id="no" class="btn btn-ghost">Tidak</button>
        <button id="yes" class="btn btn-error">Ya</button>
      </div>
    </div>
  </dialog>

  <script>
    document.querySelector('#read-more .container > button')
      .addEventListener('click', () => {
        document.getElementById('read-more').close();
      });

    document.querySelectorAll('[data-close-dialog]').forEach(button => {
      button.addEventListener('click', () => {
        document.getElementById(button.dataset.closeDialog).close();
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="/index.js"></script>
</body>
</html>
