<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKI Map</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #f8fafc;
      color: #1e293b;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #prompt {
      position: fixed;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      z-index: 50;
      display: flex;
      align-items: flex-end;
      gap: .5rem;
      padding: .5rem;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 1rem;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(15,23,42,.12);
    }

    #prompt-input {
      flex: 1;
      min-width: 0;
      height: 2.5rem;
      min-height: 2.5rem;
      resize: vertical;
      background: white;
      border-color: #e2e8f0;
    }

    #ask {
      flex-shrink: 0;
    }

    #menu {
      position: fixed;
      z-index: 40;
      top: 5.5rem;
      right: 1rem;
      display: flex;
      gap: .5rem;
      padding: .5rem;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 1rem;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(15,23,42,.1);
    }

    dialog {
      width: calc(100% - 2rem);
      max-width: 40rem;
      max-height: 85vh;
      margin: auto;
      padding: 0;
      overflow: auto;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      background: white;
      color: #1e293b;
      box-shadow: 0 24px 64px rgba(15,23,42,.2);
    }

    dialog::backdrop {
      background: rgba(15,23,42,.5);
    }

    dialog .container {
      padding: 1.5rem;
    }

    #read-more h1 {
      margin-bottom: 1rem;
      font-size: 1.5rem;
      font-weight: 800;
    }

    #read-more .content {
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    #read-more .content h1,
    #read-more .content h2,
    #read-more .content h3 {
      margin: 1rem 0 .5rem;
      line-height: 1.3;
    }

    #read-more .content p {
      margin-bottom: .75rem;
    }

    #read-more .container > button {
      display: block;
      margin-top: 1.5rem;
      margin-left: auto;
    }

    #yes-no .actions {
      display: flex;
      justify-content: flex-end;
      gap: .5rem;
      margin-top: 1.5rem;
    }

    .marker {
      background: transparent !important;
      color: white;
      font-size: .6rem;
      margin: 0;
      padding: 0;
    }

    .marker > div {
      display: block;
      padding: .4rem;
      background: rgba(0,0,0,.7);
      border-radius: .4rem;
      transform: translateY(-50%);
    }

    .marker > div:hover {
	background: darkcyan;
    }

    .marker-pin {
      background: transparent !important;
      padding: 0;
      margin: 0;
    }

    .marker-pin p {
      text-align: center;
      font-size: 1rem;
    }

    .marker-events,
    .marker-events * {
      pointer-events: auto;
      cursor: pointer;
    }

  /* Article content: raw CSS */
  .content {
    line-height: 1.8;
    color: var(--color-base-content);
  }

  .content p {
    margin: 0 0 1rem;
  }

  .content img {
    display: block;
    width: 100%;
    max-height: 480px;
    object-fit: contain;
    margin: 1.5rem auto;
    border-radius: 0.75rem;
  }

  .content a {
    color: var(--color-primary);
    text-decoration: underline;
    overflow-wrap: anywhere;
  }

  /* Quiz: raw CSS */
  .quiz {
    padding: 1.5rem;
    margin: 1rem 0;
    border: 1px solid var(--color-base-300);
    border-radius: 1rem;
    background: var(--color-base-200);
  }

  .quiz-progress {
    font-size: 0.875rem;
    color: var(--color-base-content);
    opacity: 0.65;
    margin: 0 0 0.75rem;
  }

  .quiz h3 {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.4;
    margin: 0 0 1.25rem;
  }

  .quiz button {
	border: 1px solid black;
	margin: 2rem;
	padding: 1rem;
	border-radius: 0.5rem;
  }

  .quiz button:hover {
	opacity: 0.7;
  }

  .quiz-options {
    display: grid;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .quiz-options label {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.875rem 1rem;
    border: 1px solid var(--color-base-300);
    border-radius: 0.75rem;
    cursor: pointer;
    background: var(--color-base-100);
    transition: border-color 0.15s, background 0.15s;
  }

  .quiz-options label:has(input:checked) {
    border-color: var(--color-primary);
    background: color-mix(
      in srgb,
      var(--color-primary) 10%,
      var(--color-base-100)
    );
  }

  .quiz-options label:hover {
    border-color: var(--color-primary);
  }

  .quiz-options input {
    flex-shrink: 0;
  }

  /* Dialog sizing */
  #read-more .modal-box {
    max-height: 95vh;
    overflow-y: auto;
  }

#swiper {
    position: fixed;
    bottom: 2rem;
    left: 0rem;
    width: 100vw;
    height: 45vh;
    font-size: 0.8rem;
    letter-spacing: 0.02rem;
    line-height: 1.6;
    padding: 0px;
    margin: 0px;
}

#swiper .container {
    margin: 0px;
    padding: 0px;
    width: 100%;
    height:100%;
    overflow-x: auto;
    min-width: 100vw;
    display: flex;
    flex-wrap: nowrap;
    gap: 1rem;
    scroll-behavior: smooth;
}

#swiper .card {
    height: 100%;
    width: 35rem;
    background: rgba(255,255,255,0.7);
    padding-inline: 2rem;
    padding-top: 1rem;
    border-radius: 1rem;
    flex: 0 0 auto;
    overflow-y: auto;
}

#swiper .card h2 {
    font-size: 1.7rem;
    font-weight: bold;
    color: black;
    line-height: 1;
    letter-spacing:-0.08rem;
    margin-block: 0.2rem;
}

#swiper .card .subtitle {
    font-size: 0.8rem;
}

#swiper .card .label {
    font-weight: bolder;
    letter-spacing:-0.05rem;
    color: chocolate;
    margin-top: 0.7rem;
}

#swiper .card span {
    display: inline-block;
    padding-inline: 0.5rem;
    margin-block: 0.1rem
    margin-inline: 0.1rem;
    border-radius: 1rem;
    background: coral;
    color: white;
    font-size: 0.7rem;
}

#swiper .card .eyebrow {
    font-size: 0.8rem;
    color: darkslateblue;
    font-weight:600;
    text-align: right; 
}

#swiper-button {
	transition: 0.2s;
}


#swiper-button, #swiper {
    transition: 0.5s;
}

#swiper-button {
    position: fixed;
    left: 1rem;
    bottom: 45vh;
    z-index: 999;
    width: 3rem;
    height: 3rem;
    border-radius: 999px;
    background: white;
    opacity: 0.5;
    transform: translateY(-2.5rem);
}

.swiper-button-down {
    bottom: 0rem !important;
    transform: translateY(-0.5rem) !important;
    transform: rotate(180deg) !important;
}

.swiper-hide {
    
    width: 0rem !important;
    height: 0rem !important;
    opacity: 0;
}
/*
#swiper .container {
    scroll-snap-type: x mandatory;
}

#swiper .card {
    scroll-snap-align: start;
}
*/
  @media (max-width: 640px) {
    #read-more .modal-box {
      width: 100%;
      max-width: none;
      max-height: 100dvh;
      border-radius: 0;
      padding: 1.25rem;
    }

    .quiz {
      padding: 1rem;
    }

      #swiper .card {
		width: 100vw;	
      }

  }

    @media (max-width: 480px) {
      #prompt {
        top: .75rem;
        left: .75rem;
        right: .75rem;
      }

      #ask {
        padding-inline: .8rem;
      }

      #menu {
        top: 5rem;
        right: .75rem;
      }

      dialog .container {
        padding: 1.25rem;
      }

    }
  </style>
</head>

<body>
  <header></header>

  <main>
    <div id="map"></div>

    <section id="prompt">
      <textarea
        id="prompt-input"
        class="textarea textarea-bordered"
        rows="1"
        placeholder="Petakan sejarah..."
      ></textarea>

      <button id="ask" class="btn btn-primary" title="Ask AI">
        Jalankan
      </button>
    </section>
<!--
    <section id="menu" style="display:none;">
      <button id="save" class="btn btn-primary btn-sm">
        Simpan
      </button>
      <button id="load" class="btn btn-outline btn-sm">
        Buka
      </button>
    </section>
  -->
    <section id="control">
	    <button id="swiper-button"><span>▼<span></button>
    </section>
    <section id="swiper">
	<div class="container"></div>
    </section>
  </main>

  <footer></footer>


<dialog id="read-more">
  <div class="p-10 w-full max-w-4xl flex flex-col gap-4">
      <h1 class="text-3xl text-center font-bold mb-4">
      </h1>

      <div class="content"></div>

      <div class="divider"></div>

      <h2 class="text-2xl font-bold text-center">QUIZ</h2>
      <p class="text-base-content/70 text-center">Uji pemahaman Anda</p>

      <div class="quiz"></div>

      <div class="flex justify-end">
        <button class="btn btn-ghost">
          Tutup
        </button>
      </div>
  </div>
</dialog>

  <dialog id="read-more">
    <div class="container">
      <h1></h1>
      <div class="content"></div>
      <h2>QUIZ</h2>
      <p>Uji pemahaman Anda</p>
      <div class="quiz"></div>
      <button class="btn btn-primary">Tutup</button>
    </div>
  </dialog>
-->
  <!-- Storage list dialog -->
  <dialog id="storage-dialog">
    <div class="container">
      <div class="flex items-center justify-between gap-4 mb-4">
        <h2 class="text-xl font-bold">Data Tersimpan</h2>
        <button class="btn btn-ghost btn-sm" data-close-dialog="storage-dialog">✕</button>
      </div>

      <!-- Render saved files here -->
      <div id="storage-list" class="flex flex-col gap-3"></div>
    </div>
  </dialog>

  <dialog id="view">
    <div class="container">
      <div class="flex items-center justify-between gap-4 mb-4">
        <h2 class="text-xl font-bold">Detail Data</h2>
        <button class="btn btn-ghost btn-sm" data-close-dialog="view">✕</button>
      </div>
    </div>
  </dialog>

  <dialog id="confirm-dialog">
    <div id="yes-no" class="container">
      <h4 class="text-lg font-bold"></h4>
      <div class="actions">
        <button id="no" class="btn btn-ghost">Tidak</button>
        <button id="yes" class="btn btn-error">Ya</button>
      </div>
    </div>
  </dialog>

  <script>
    //document.querySelector('#read-more .container > button')
    //  .addEventListener('click', () => {
    //    document.getElementById('read-more').close();
    //  });

    document.querySelectorAll('[data-close-dialog]').forEach(button => {
      button.addEventListener('click', () => {
        document.getElementById(button.dataset.closeDialog).close();
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="index.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
